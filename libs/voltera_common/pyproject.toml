[project]
name = "voltera-common"
version = "0.2.0"
description = "Libreria comun de la experimentacion 2 de Voltera: CloudEvents, publicador al Event Mesh, correlacion e inyeccion de fallos"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
kafka = ["confluent-kafka>=2.4"]
aws = ["aws-lambda-powertools>=3.0", "boto3>=1.34"]
test = ["pytest>=8", "moto[dynamodb,sqs]>=5", "aws-lambda-powertools>=3.0", "boto3>=1.34"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["voltera_common*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
