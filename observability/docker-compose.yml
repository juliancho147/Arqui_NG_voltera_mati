# Grafana OSS local para visualizar los experimentos de Voltera (Exp. 2).
# Uso: cp .env.example .env && (crear aws/credentials, ver README) && docker compose up -d
# Solo lectura: el perfil AWS dedicado (voltera-grafana) NO tiene permisos de escritura.
name: voltera-observability

services:
  grafana:
    image: grafana/grafana-oss:${GRAFANA_VERSION:-11.4.0}
    container_name: voltera-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"   # solo accesible desde esta maquina
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?define GRAFANA_ADMIN_PASSWORD en .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_INSTALL_PLUGINS: ${GF_INSTALL_PLUGINS:-grafana-x-ray-datasource}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/00-ciclo-en-vivo.json
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Region y perfil AWS: los lee el provisioning de datasources y el SDK de AWS.
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      AWS_PROFILE: ${AWS_PROFILE:-voltera-grafana}
      # Archivo de credenciales MINIMO (solo el perfil voltera-grafana), no el ~/.aws completo.
      AWS_SHARED_CREDENTIALS_FILE: /etc/grafana/aws/credentials
      AWS_SDK_LOAD_CONFIG: "false"
    volumes:
      - ./provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - ${AWS_CREDENTIALS_FILE:-./aws/credentials}:/etc/grafana/aws/credentials:ro
      - grafana-data:/var/lib/grafana
    tmpfs:
      - /var/lib/grafana/dashboards/_legacy   # oculta los dashboards antiguos: el proveedor de archivos recorre subcarpetas

volumes:
  grafana-data:
